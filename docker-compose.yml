# Runs the whole project locally: docker compose up --build
# Backend: http://localhost:8000/docs   Frontend: http://localhost:5173
services:
  backend:
    build: ./backend
    ports:
      - "8000:7860"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/weights:/app/weights

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
